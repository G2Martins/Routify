name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      # O ambiente da produção inteiro (osmnx, xgboost, pandas dos .pkl). Com um subconjunto, teste que importava a
      # rota passava no PC e quebrava aqui (3 vermelhos em 2026-11-02/03) e 14 testes pulavam calados.
      - run: pip install -r apps/api/requirements.txt pytest
      - run: python -m compileall -q apps/api services ml
      - run: pytest -q -rs
        working-directory: apps/api
      # Coletor: rotação de chaves e cadência pela cota (rede e banco simulados).
      - run: pip install requests schedule python-dotenv
      - run: pytest -q tests
        working-directory: services/collector

  frontend:
    name: App mobile (tsc + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # o npm test usa --experimental-strip-types (Node >= 22.6)
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  admin:
    name: Painel ADM (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
