    <title>Routify — Roteamento preditivo para Brasília/DF (TCC 2026)</title>

    <meta property="og:image:height" content="630" />

    <!-- Dados estruturados. Sem AggregateRating/Review: não existe avaliação real por trás. -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Routify",
            "description": "Roteamento preditivo para Brasília/DF: projeto de TCC 2026.",
            "inLanguage": "pt-BR"
          },
          {
            "@type": "WebApplication",
            "@id": "%SITE_URL%/#app",
            "url": "%SITE_URL%/",
            "name": "Routify",
            "description": "Routify é um aplicativo de roteamento preditivo para Brasília/DF, desenvolvido como Trabalho de Conclusão de Curso (TCC 2026). O modelo LIA, baseado em XGBoost, prevê a razão de congestionamento de cada via; o roteador A* usa o tempo de viagem previsto e combina o resultado com o trânsito ao vivo da TomTom. Projeto acadêmico e gratuito.",
            "applicationCategory": "TravelApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requer JavaScript",
            "inLanguage": "pt-BR",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
            "image": "%SITE_URL%/og-image.png",
            "isPartOf": { "@id": "%SITE_URL%/#website" },
            "spatialCoverage": { "@type": "AdministrativeArea", "name": "Distrito Federal, Brasil" },
            "featureList": [
              "Rotas pelo tempo de viagem previsto pela LIA (A* sobre o mapa do OpenStreetMap)",
              "Trânsito ao vivo por trecho, combinado com a TomTom",
              "Busca de endereços e pontos de interesse do Distrito Federal",
              "Histórico de rotas por conta"
            ],
            "author": [
              { "@type": "Person", "name": "Pedro Borges Alves", "affiliation": { "@type": "CollegeOrUniversity", "name": "IESB" } },
              { "@type": "Person", "name": "Gustavo Martins Gripaldi", "affiliation": { "@type": "CollegeOrUniversity", "name": "IESB" } }
            ],
            "sameAs": ["https://github.com/G2Martins/Routify"]
          }

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */

        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <noscript>
      <style>
        body {
          overflow: auto;
        }
      </style>
    </noscript>
  </head>

  <body>
    <!-- Sem JavaScript (rastreadores de texto, leitores simples): descrição do projeto. -->
    <noscript>
      <main style="max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.55; color: #0f1f44">
        <h1>Routify — roteamento preditivo para Brasília/DF</h1>
        <p>
          O Routify é um aplicativo de roteamento para o Distrito Federal, desenvolvido como Trabalho de Conclusão de Curso (TCC 2026, IESB,
          Engenharia da Computação). O modelo LIA, baseado em XGBoost, prevê o congestionamento de cada via por horário e dia da semana; as
          rotas são calculadas com A* sobre o mapa do OpenStreetMap pelo tempo de viagem previsto e combinadas com o trânsito ao vivo da
          TomTom.
        </p>
        <p>É um protótipo acadêmico e gratuito, com cobertura apenas do Distrito Federal. O aplicativo precisa de JavaScript para abrir o mapa: ative-o no navegador para usar o Routify.</p>
        <p>
          Código-fonte e documentação: <a href="https://github.com/G2Martins/Routify">github.com/G2Martins/Routify</a>. Descrição para IAs:
          <a href="/llms.txt">llms.txt</a>.
        </p>
      </main>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
