   <text style="fill: #898781; font: 7.5px 'Segoe UI', 'DejaVu Sans'" transform="translate(7.2 325.266953)">Confiança = (teto − erro) / (teto − piso), limitada a [0, 1]: piso = dispersão interna média de uma via; teto = erro do fallback global.</text>
   <text style="fill: #898781; font: 7.5px 'Segoe UI', 'DejaVu Sans'" transform="translate(7.2 333.825391)">Curva: IsotonicRegression não crescente sobre a confiança de cada par (já recortada); pontos: confiança do erro médio da faixa. A média de valores</text>
   <text style="fill: #898781; font: 7.5px 'Segoe UI', 'DejaVu Sans'" transform="translate(7.2 342.383828)">recortados fica acima do recorte da média — por isso a curva passa acima dos pontos além de ~600 m (fora do raio usado pela API). Fonte: ml/artifacts/calibracao_transfer.json.</text>
  </g>
